[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-agent-cli"
version = "0.1.12"
description = "CLI + Python client for Notion's internal AI chat panel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "brotli>=1.1",
    "curl-cffi>=0.13",
    "h2>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "fastapi>=0.110",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
notion-agent = "notion_agent_cli.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_agent_cli"]
